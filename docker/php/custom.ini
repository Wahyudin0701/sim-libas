; -----------------------------------------------------------------------------
; Konfigurasi PHP Khusus SIM-LiBas RT 15 Pematang Sulur
; -----------------------------------------------------------------------------

[PHP]
memory_limit = 512M
max_execution_time = 120
max_input_time = 60
upload_max_filesize = 10M
post_max_size = 12M
max_input_vars = 3000
date.timezone = Asia/Jakarta
expose_php = Off

; Display & Log Errors
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; -----------------------------------------------------------------------------
; Mitigasi Keamanan PHP2Shell (CVE-2026-109618 & CVE-2026-109619)
; Menonaktifkan fitur session.upload_progress bawaan PHP yang menjadi
; vektor utama eksploitasi Use-After-Free (UAF) pada CVE-2026-109619.
; SIM-LiBas tidak menggunakan fitur ini — Laravel mengelola upload
; melalui mekanisme sendiri (Livewire/Request), sehingga 100% aman.
; Referensi: https://nvd.nist.gov/vuln/detail/CVE-2026-109619
; -----------------------------------------------------------------------------
[Session]
session.upload_progress.enabled = 0

; -----------------------------------------------------------------------------
; OPcache Production Hardening
; -----------------------------------------------------------------------------
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.max_wasted_percentage = 5
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
